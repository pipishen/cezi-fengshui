<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>测字阁 · 风水运势测字</title>
<style>
:root{
  --bg:#12100e; --ink:#e8dcc3; --ink-dim:#9c8f78;
  --gold:#c9a45c; --gold-bright:#e6c87e; --red:#b03a2e; --red-bright:#d45b4a;
  --card:#201c17; --line:#3a332a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"STKaiti","KaiTi","楷体","Noto Serif SC",serif;
  background:radial-gradient(1200px 800px at 50% -10%,#241f18 0%,var(--bg) 60%);
  color:var(--ink); min-height:100vh; padding-bottom:60px;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px}
header{text-align:center;padding:26px 0 8px}
header .zi{font-size:64px;line-height:1;color:var(--gold-bright);text-shadow:0 0 30px rgba(201,164,92,.35)}
header h1{font-size:30px;letter-spacing:12px;color:var(--gold);font-weight:normal;margin-top:10px}
header p{color:var(--ink-dim);font-size:14px;margin-top:8px;letter-spacing:3px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-dim);font-size:13px;letter-spacing:4px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(600px 200px at 50% 0,rgba(201,164,92,.06),transparent)}
.board-wrap{position:relative;border-radius:10px;overflow:hidden;background:radial-gradient(500px 500px at 50% 40%,#26211a 0%,#171410 70%);border:1px solid var(--line);touch-action:none}
canvas{display:block;width:100%;height:340px;cursor:crosshair}
.board-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(232,220,195,.14);font-size:90px;pointer-events:none;letter-spacing:10px;transition:opacity .4s}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.tools label{font-size:13px;color:var(--ink-dim)}
input[type=range]{accent-color:var(--gold);width:110px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:#fff}
.btn{font-family:inherit;background:linear-gradient(180deg,#2b251d,#211c15);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:15px;cursor:pointer;letter-spacing:2px}
.btn:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn.primary{display:block;width:100%;margin-top:16px;background:linear-gradient(180deg,#8e2f24,#6e2118);border-color:#a03d30;color:#f5e6c8;font-size:18px;padding:12px;letter-spacing:10px}
.btn.primary:hover{filter:brightness(1.15)}
#result{display:none;margin-top:8px}
#result.show{display:block;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.res-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.big-char{width:110px;height:110px;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#2c261d,#191510);border:1px solid var(--gold);border-radius:12px;box-shadow:0 0 24px rgba(201,164,92,.15) inset;overflow:hidden}
.big-char img{width:100%;height:100%;object-fit:contain;filter:invert(.92) sepia(.4) saturate(3) hue-rotate(-15deg)}
.seal{width:46px;height:46px;flex:none;background:linear-gradient(160deg,var(--red-bright),#8e2f24);color:#f7e9c9;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:8px;transform:rotate(-8deg);box-shadow:0 2px 8px rgba(0,0,0,.5);margin-left:auto;animation:stamp .45s cubic-bezier(.2,2.2,.4,1) .3s both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.res-meta{font-size:15px;color:var(--ink-dim);line-height:1.9;flex:1;min-width:200px}
.res-meta b{color:var(--gold-bright);font-weight:normal}
.score-row{display:flex;align-items:center;gap:14px;margin:16px 0 6px}
.score-num{font-size:40px;color:var(--gold-bright)}
.stars{color:var(--gold);font-size:18px;letter-spacing:3px}
.stars .off{color:#4a4234}
.bar{height:8px;background:#14110d;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a5a2a,var(--gold-bright));width:0;transition:width 1.2s ease}
.aspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.asp{background:#171410;border:1px solid var(--line);border-radius:10px;padding:12px}
.asp h4{font-size:15px;color:var(--gold);font-weight:normal;letter-spacing:3px;margin-bottom:6px}
.asp .lv{font-size:12px;color:var(--red-bright);margin-left:6px;letter-spacing:0}
.asp p{font-size:13.5px;color:var(--ink-dim);line-height:1.75}
.yiji{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.yi,.ji{flex:1;min-width:220px;border-radius:10px;padding:12px 14px;font-size:14px;line-height:2}
.yi{background:rgba(201,164,92,.08);border:1px solid rgba(201,164,92,.35)}
.ji{background:rgba(176,58,46,.08);border:1px solid rgba(176,58,46,.4)}
.yi b{color:var(--gold-bright);font-weight:normal;letter-spacing:3px}
.ji b{color:var(--red-bright);font-weight:normal;letter-spacing:3px}
.lucky{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.lucky div{flex:1;min-width:100px;background:#171410;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.lucky small{display:block;color:var(--ink-dim);font-size:12px;letter-spacing:3px;margin-bottom:4px}
.lucky span{font-size:16px;color:var(--gold-bright)}
.notice{margin-top:16px;font-size:12.5px;color:#6f6656;text-align:center;letter-spacing:1px;line-height:1.8}
footer{text-align:center;color:#5c5344;font-size:12px;margin-top:34px;letter-spacing:2px}
.copy-btn{margin-top:14px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="zi">测</div>
    <h1>测 字 阁</h1>
    <p>心诚一笔 · 字里乾坤</p>
  </header>

  <div class="divider">壹 · 挥毫</div>
  <div class="panel">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="board-hint" id="hint">书</div>
    </div>
    <div class="tools">
      <label>笔触</label><input type="range" id="size" min="3" max="24" value="9">
      <div class="swatch on" data-c="#e8dcc3" style="background:#e8dcc3"></div>
      <div class="swatch" data-c="#d45b4a" style="background:#d45b4a"></div>
      <div class="swatch" data-c="#c9a45c" style="background:#c9a45c"></div>
      <button class="btn" id="undo">↩ 撤笔</button>
      <button class="btn" id="clear">✕ 洗砚</button>
    </div>
    <button class="btn primary" id="go">测 字</button>
  </div>

  <div id="result">
    <div class="divider">贰 · 解字</div>
    <div class="panel">
      <div class="res-head">
        <div class="big-char" id="rChar"></div>
        <div class="res-meta" id="rMeta"></div>
        <div class="seal">测</div>
      </div>
      <div class="score-row">
        <div class="score-num" id="rScore">--</div>
        <div>
          <div class="stars" id="rStars"></div>
          <div style="font-size:13px;color:var(--ink-dim)" id="rLevel"></div>
        </div>
      </div>
      <div class="bar"><i id="rBar"></i></div>
      <div class="aspects" id="rAspects"></div>
      <div class="yiji">
        <div class="yi"><b>宜</b>　<span id="rYi"></span></div>
        <div class="ji"><b>忌</b>　<span id="rJi"></span></div>
      </div>
      <div class="lucky" id="rLucky"></div>
      <button class="btn copy-btn" id="copy">复制签文</button>
      <div class="notice">签文由笔迹形态、五行气韵与当日运数推演，仅供娱乐，请勿迷信。</div>
    </div>
  </div>

  <footer>测字阁 · 娱乐为主 · 信则有 不信则无</footer>
</div>

<script>
/* ============ 笔迹特征提取（字相学） ============ */
function extractFeatures(){
  const W=cv.getBoundingClientRect().width,H=340;
  let totalLen=0,sumX=0,sumY=0,wt=0;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  let hSeg=0,vSeg=0,sSeg=0;
  for(const st of strokes){
    for(let i=1;i<st.pts.length;i++){
      const a=st.pts[i-1],b=st.pts[i];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d<1.5) continue;
      totalLen+=d; sumX+=(a.x+b.x)/2*d; sumY+=(a.y+b.y)/2*d; wt+=d;
      minX=Math.min(minX,a.x,b.x);maxX=Math.max(maxX,a.x,b.x);
      minY=Math.min(minY,a.y,b.y);maxY=Math.max(maxY,a.y,b.y);
      const ang=Math.abs(Math.atan2(dy,dx));
      if(ang<Math.PI/6||ang>Math.PI*5/6) hSeg+=d;
      else if(ang>Math.PI/3&&ang<Math.PI*2/3) vSeg+=d;
      else sSeg+=d;
    }
  }
  if(!wt) return null;
  return {
    count:strokes.length,
    cx:sumX/wt/W, cy:sumY/wt/H,
    density:totalLen*size/(W*H),
    hRatio:hSeg/(hSeg+vSeg+sSeg||1),
    vRatio:vSeg/(hSeg+vSeg+sSeg||1),
    coverage:((maxX-minX)/W)*((maxY-minY)/H)
  };
}

/* ============ 签文模板 ============ */
const HW={
count:{
  few:["落笔寥寥，是果决爽利之人。运势贵在「快」——念头一起即行动，莫让犹豫偷走时机。","字简而神聚，心无杂念。近期宜做减法，断舍离之后，好运自有空隙钻进来。"],
  mid:["笔画匀称，进退有度。运势平稳上升，一步一脚印，比急功近利者行得更远。","不多不少，恰到好处。此为「中道」之相，守住分寸，就是守住运气。"],
  many:["笔笔不苟，心思细密。谋事周密是你的长处，但过虑则滞，七分谋定，三分随缘。","字繁而有序，能驾驭复杂局面。近期琐事虽多，条分缕析后皆是坦途。"]},
hPos:{
  left:["笔迹重心偏左，是念旧之人。旧友旧物之中藏有助力，回头看看，答案早在来处。","字倾于左，主「守」。宜巩固既有基业，回头收拾旧山河，胜过开疆拓土。"],
  center:["重心居中正安稳，泰山崩于前而色不变。以不变应万变，便是你近期的最好策略。"],
  right:["笔势向右开拓，志在远方。新领域、新面孔之中有贵人，敢于迈出第一步便是赢。","重心右倾，主前瞻。眼光放远，近期所作铺垫，来月可见回响。"]},
vPos:{
  top:["字起高处，志向凌云。目标不妨定得大胆一些，近日有「好风凭借力」之象。","笔意上扬，贵人提携之兆。抬头看路，低头做事，两不耽误。"],
  middle:"行止有度，不冒进不消沉，此为将帅之气。稳住节奏，好运在半山腰等你。",
  bottom:["字落实处，是务本之人。近期财运脚踏实地而来，一笔一笔，皆是正经进账。","笔沉于下，宜接地气。多走动、多实干，好运藏在汗水里。"]},
weight:{
  heavy:["落墨酣畅，气魄过人。运势如满弓之箭，势头正猛，但弦满易折，留三分力给明天。","笔墨饱满，心力充足。近期可啃硬骨头，难事到你手里皆能软化。"],
  light:["笔清墨淡，是通透之人。运势如溪水流石，不争而胜，以柔克刚，静中有大吉祥。","字迹清瘦，神清气爽。近期宜读书静心，充电之后，自然电量满格出发。"]},
slant:{
  flat:"横画端稳，为人可靠。合作运极佳，别人愿意把要紧事托付于你，这就是最硬的底牌。",
  tall:"竖画挺拔，骨气凛然。事业运上行，敢于坚持己见者，近期能赢得关键一役。",
  tilt:"笔走龙蛇，斜中取劲。灵感是你的财富，近期创意、点子变现的机会颇多。"},
spread:{
  wide:["字占满盘，格局开张。大场面压不住你，近期宜争取亮相的机会，台风就是你的风水。","挥洒自如，气象宏大。胆子再放大一点，你想要的东西也在等你去取。"],
  narrow:["字聚中央，收敛内敛。藏锋守拙之时，暗地积累，厚积薄发，一鸣惊人未远。"]}
};
const YI=["会友","读书","早起","行善","整理","沐浴","拜访长辈","签约","出行","理财","写字","冥想","晒太阳","种花","吃素","早睡","听雨","整理钱包","给家人打电话","存钱","学习新技能","打扫","添新衣","祈福","慢走","喝茶"];
const JI=["争执","熬夜","冲动消费","食生冷","背后议人","迟到","借钱","赌博","翻旧账","动怒","过劳","饮酒过量","独处过久","食言","攀比","高风险投资","贪凉","久坐","说大话","匆忙决定"];
const COLOR={金:"白、金色",木:"青、绿色",水:"黑、蓝色",火:"红、紫色",土:"黄、褐色"};
const DIR={金:"西方",木:"东方",水:"北方",火:"南方",土:"中原、本地"};

/* 81 数理 */
const LUCKY=[1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,57,61,63,65,67,68,81];
const HALF=[30,38,58,71,73,75];
function shuli(n){n=((n-1)%81)+1;if(LUCKY.includes(n))return{lv:"吉",n};if(HALF.includes(n))return{lv:"半吉",n};return{lv:"平",n}}

/* 五行生克 */
const SHENG={金:"水",水:"木",木:"火",火:"土",土:"金"};
const KE={金:"木",木:"土",土:"水",水:"火",火:"金"};
function relation(charE,dayE){
  if(charE===dayE) return ["比和","字与今日气运同气连枝，行事得心应手，顺遂之象。"];
  if(SHENG[charE]===dayE) return ["生气","你所书之字泄秀于今日，才华外显，付出有得，宜主动出击。"];
  if(SHENG[dayE]===charE) return ["相生","今日气运生扶此字，贵人暗助，逢山有路，宜把握机缘。"];
  if(KE[charE]===dayE) return ["我克","字克日运，财为我所掌，利于求财落实，但须防劳碌伤身。"];
  return ["克我","日运克字，小有压力，宜守不宜攻，以柔克刚，静待转机。"];
}
function hwElement(f){
  const score={金:0,木:0,水:0,火:0,土:0};
  score[f.hRatio>0.5?"土":"木"]+=1;
  score[f.vRatio>0.35?"木":"金"]+=1;
  score[f.density>0.055?"火":"水"]+=1;
  score[f.cx>0.62?"金":f.cx<0.38?"木":"土"]+=1;
  score[f.cy<0.42?"火":f.cy>0.62?"水":"土"]+=1;
  return Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
}

/* ============ 工具 ============ */
function hashStr(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)]}
function shuffle(rng,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function dayElement(){const d=new Date();const base=Math.floor(d.getTime()/86400000);return ["金","木","水","火","土"][base%5]}
function levelOf(s){return s>=90?"上上签":s>=80?"上签":s>=70?"中上签":s>=60?"中签":"下签"}

/* ============ 画板 ============ */
const cv=document.getElementById("board"),ctx=cv.getContext("2d");
const hint=document.getElementById("hint");
let strokes=[],cur=null,color="#e8dcc3",size=9,drawing=false;
function resize(){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=340*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}
function redraw(){
  const r=cv.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,340);
  for(const st of strokes) paint(st);
  hint.style.opacity=strokes.length?0:1;
}
function paint(st){
  const pts=st.pts;if(pts.length<2){dot(st,pts[0]);return}
  ctx.strokeStyle=st.c;ctx.lineCap="round";ctx.lineJoin="round";
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    const d=Math.hypot(b.x-a.x,b.y-a.y);
    ctx.lineWidth=Math.max(2,st.w*(1-Math.min(d,60)/80));
    ctx.beginPath();
    if(i===1){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}
    else{
      const m=pts[i-2];
      ctx.moveTo((m.x+a.x)/2,(m.y+a.y)/2);ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);
    }
    ctx.stroke();
  }
}
function dot(st,p){ctx.fillStyle=st.c;ctx.beginPath();ctx.arc(p.x,p.y,st.w/2,0,7);ctx.fill()}
function pos(e){
  const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function down(e){e.preventDefault();drawing=true;cur={c:color,w:size,pts:[pos(e)]};strokes.push(cur);paint(cur)}
function move(e){if(!drawing)return;e.preventDefault();cur.pts.push(pos(e));redraw()}
function up(){drawing=false;cur=null}
cv.addEventListener("mousedown",down);cv.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
cv.addEventListener("touchstart",down,{passive:false});cv.addEventListener("touchmove",move,{passive:false});
cv.addEventListener("touchend",up);
document.getElementById("undo").onclick=()=>{strokes.pop();redraw()};
document.getElementById("clear").onclick=()=>{strokes=[];redraw()};
document.getElementById("size").oninput=e=>size=+e.target.value;
document.querySelectorAll(".swatch").forEach(s=>s.onclick=()=>{
  document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("on"));
  s.classList.add("on");color=s.dataset.c;
});
window.addEventListener("resize",resize);

/* ============ 解签 ============ */
let lastResultText="";
function snapshot(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const st of strokes)for(const p of st.pts){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}
  const pad=14,bw=Math.max(maxX-minX+pad*2,10),bh=Math.max(maxY-minY+pad*2,10);
  const off=document.createElement("canvas");off.width=bw;off.height=bh;
  const octx=off.getContext("2d");
  for(const st of strokes){
    const pts=st.pts;
    octx.strokeStyle=st.c;octx.fillStyle=st.c;octx.lineCap="round";octx.lineJoin="round";
    if(pts.length<2){octx.beginPath();octx.arc(pts[0].x-minX+pad,pts[0].y-minY+pad,st.w/2,0,7);octx.fill();continue}
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1],b=pts[i];
      const d=Math.hypot(b.x-a.x,b.y-a.y);
      octx.lineWidth=Math.max(2,st.w*(1-Math.min(d,60)/80));
      octx.beginPath();
      if(i===1){octx.moveTo(a.x-minX+pad,a.y-minY+pad);octx.lineTo(b.x-minX+pad,b.y-minY+pad)}
      else{
        const m=pts[i-2];
        octx.moveTo((m.x+a.x)/2-minX+pad,(m.y+a.y)/2-minY+pad);
        octx.quadraticCurveTo(a.x-minX+pad,a.y-minY+pad,(a.x+b.x)/2-minX+pad,(a.y+b.y)/2-minY+pad);
      }
      octx.stroke();
    }
  }
  return off.toDataURL();
}
function go(){
  if(!strokes.length){alert("请先在画板上挥毫写字，再点「测字」");return}
  const f=extractFeatures();
  const seed=hashStr([Math.round(f.cx*50),Math.round(f.cy*50),f.count,Math.round(f.density*1000),todayStr()].join("|"));
  const rng=mulberry32(seed);
  const sl=shuli(f.count);
  let base=sl.lv==="吉"?82:sl.lv==="半吉"?70:60;
  if(f.density>0.09)base-=4; if(f.coverage>0.45)base+=3; if(f.coverage<0.08)base-=3;
  const score=Math.max(40,Math.min(99,Math.round(base+rng()*16-8)));
  const level=levelOf(score);
  const e=hwElement(f),dayE=dayElement();
  const [relName]=relation(e,dayE);

  const countTxt=f.count<=3?pick(rng,HW.count.few):f.count<=9?pick(rng,HW.count.mid):pick(rng,HW.count.many);
  const hTxt=f.cx<0.42?pick(rng,HW.hPos.left):f.cx>0.58?pick(rng,HW.hPos.right):pick(rng,HW.hPos.center);
  const vTxt=Array.isArray(HW.vPos.top)?(f.cy<0.40?pick(rng,HW.vPos.top):f.cy>0.60?pick(rng,HW.vPos.bottom):HW.vPos.middle):HW.vPos.middle;
  const wTxt=f.density>0.05?pick(rng,HW.weight.heavy):pick(rng,HW.weight.light);
  const sTxt=f.hRatio>0.55?HW.slant.flat:f.vRatio>0.35?HW.slant.tall:HW.slant.tilt;
  const spTxt=f.coverage>0.28?pick(rng,HW.spread.wide):pick(rng,HW.spread.narrow);

  const tags=["大吉","顺遂","平稳","留意","谨慎"];
  const aspPairs=[["综合运势",countTxt],["事业学业",hTxt],["财运",vTxt],["感情人缘",wTxt],["健康平安",spTxt+" "+sTxt]];
  const aspects=aspPairs.map(([t,txt],i)=>{
    const lv=score-i*4-rng()*10;
    const tag=lv>85?tags[0]:lv>75?tags[1]:lv>65?tags[2]:lv>55?tags[3]:tags[4];
    return `<div class="asp"><h4>${t}<span class="lv">${tag}</span></h4><p>${txt}</p></div>`;
  }).join("");
  const yi=shuffle(rng,YI).slice(0,3).join("、");
  const ji=shuffle(rng,JI).slice(0,3).join("、");

  document.getElementById("rChar").innerHTML=`<img src="${snapshot()}" alt="笔迹">`;
  document.getElementById("rMeta").innerHTML=
    `测字方式：<b>笔迹字相</b>（不问所书何字）<br>`+
    `笔迹五行气韵属 <b>${e}</b> ・ 今日气运属 <b>${dayE}</b> ・ ${relName}`+
    `<br>笔画 <b>${f.count}</b> 画，应数理第 <b>${sl.n}</b> 数（<b>${sl.lv}</b>）`;
  document.getElementById("rScore").textContent=score;
  document.getElementById("rLevel").textContent=level+" ・ "+relName;
  const full=Math.max(1,Math.round(score/20));
  document.getElementById("rStars").innerHTML="★".repeat(full)+'<span class="off">'+"★".repeat(5-full)+"</span>";
  document.getElementById("rBar").style.width="0";
  setTimeout(()=>{document.getElementById("rBar").style.width=score+"%"},120);
  document.getElementById("rAspects").innerHTML=aspects;
  document.getElementById("rYi").textContent=yi;
  document.getElementById("rJi").textContent=ji;
  document.getElementById("rLucky").innerHTML=
    `<div><small>幸运色</small><span>${COLOR[e]}</span></div>
     <div><small>吉利方位</small><span>${DIR[e]}</span></div>
     <div><small>幸运数字</small><span>${1+Math.floor(rng()*9)}、${1+Math.floor(rng()*9)}</span></div>
     <div><small>时辰建议</small><span>${pick(rng,["子时","卯时","巳时","午时","申时","酉时","亥时"])}</span></div>`;

  lastResultText=`【测字阁・笔迹测・${todayStr()}】\n今日亲笔一字，${level}，运势 ${score} 分。\n笔迹五行属${e}，与今日${dayE}运成「${relName}」之局。\n宜：${yi}；忌：${ji}。\n幸运色：${COLOR[e]}；吉方：${DIR[e]}。\n（娱乐为主，切勿迷信）`;

  const res=document.getElementById("result");
  res.classList.remove("show"); void res.offsetWidth; res.classList.add("show");
  res.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("go").onclick=go;
document.getElementById("copy").onclick=function(){
  navigator.clipboard.writeText(lastResultText).then(()=>{this.textContent="已复制 ✓";setTimeout(()=>this.textContent="复制签文",1500)});
};
resize();
</script>
